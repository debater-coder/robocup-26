[project]
name = "controller"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cobs>=1.2.2",
    "numpy>=2.2.6",
    "opencv-python>=4.11.0.86",
    "py-trees>=2.4.0",
    "pyserial>=3.5",
    "requests>=2.33.1",
    "rerun-sdk>=0.33.0",
]

[tool.uv.sources]
opencv-python = [
    { index = "piwheels", marker = "platform_machine == 'aarch64'" },
    { index = "pypi", marker = "platform_machine != 'aarch64'"  }
]

[[tool.uv.index]]
name = "piwheels"
url = "https://piwheels.org/simple"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
